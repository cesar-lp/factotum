# .github/workflows/build-deck.yml
name: Build deck

on:
  push:
    branches: [main]
    paths: ['vault/**', 'pipeline/**', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deck
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Defence in depth: this is the only non-PR path that can land on
      # main (ci.yml's typecheck only runs pre-merge on PRs, and the
      # branch-protection ruleset still permits direct pushes to main).
      # build:deck below is a tsx/ts-node run, not a type check, so without
      # this a type error could reach main undetected via a direct push.
      - run: npm run typecheck
      - run: npm run build:deck
      # Loop safety, two layers:
      # 1. Primary: actions/checkout wires the remote with GITHUB_TOKEN, and pushes
      #    made with GITHUB_TOKEN do not trigger new workflow runs (GitHub docs).
      #    This holds even though the commit touches vault/**, which matches
      #    our own paths: filter above.
      # 2. Belt-and-braces: [skip ci] below, honored by GitHub for push events.
      #    If this workflow is ever switched to a PAT, layer 1 is lost and
      #    [skip ci] becomes the only thing preventing a self-trigger loop.
      #
      # Also note: this step pushes directly to main. If branch protection
      # (required reviews, required status checks, or push restrictions) is
      # ever enabled on main, this push will start failing here.
      - name: Commit generated ids and deck
        run: |
          git config user.name  "factotum-bot"
          git config user.email "factotum-bot@users.noreply.github.com"
          paths=(deck)
          [ -d vault ] && paths=(vault deck)
          if [[ -n "$(git status --porcelain "${paths[@]}")" ]]; then
            git add "${paths[@]}"
            git commit -m "chore: rebuild deck [skip ci]"
            git push
          else
            echo "No deck changes"
          fi
